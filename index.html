<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paycheck Plan</title>
<meta name="description" content="Paychecks, spending, mileage, debt, and taxes in one place.">
<meta name="theme-color" content="#EDF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1618" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paycheck Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --paper:#EDF0EA; --card:#FFFFFF; --ink:#16282B; --mute:#5B6E71; --line:#D3DBD5; --field:#FAFBF9;
  --accent:#1F5F52; --on-accent:#FFFFFF; --accent-ink:#143F36; --mist:#DCE8E1; --gold:#C48A1A;
  --brick:#A8392B; --brick-bg:#F6E3DF; --warn-ink:#6B2218; --good:#1F6B4A; --dots:#B9C4BD;
  --sans:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --num:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
:root[data-theme="dark"]{
  --paper:#0D1618; --card:#152225; --ink:#E7F0EC; --mute:#8FA6A2; --line:#263639; --field:#0F1B1D;
  --accent:#5CC2A8; --on-accent:#07201A; --accent-ink:#A8E6D4; --mist:#1D3935; --gold:#E0A83A;
  --brick:#F08A78; --brick-bg:#3A1F1B; --warn-ink:#F7C9C0; --good:#6FD3A0; --dots:#385055;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --paper:#0D1618; --card:#152225; --ink:#E7F0EC; --mute:#8FA6A2; --line:#263639; --field:#0F1B1D;
    --accent:#5CC2A8; --on-accent:#07201A; --accent-ink:#A8E6D4; --mist:#1D3935; --gold:#E0A83A;
    --brick:#F08A78; --brick-bg:#3A1F1B; --warn-ink:#F7C9C0; --good:#6FD3A0; --dots:#385055;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;color-scheme:light dark;overscroll-behavior-y:none}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--sans);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:4;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
.ttl{font-size:25px;font-weight:800;letter-spacing:-.02em}
.back{background:none;border:0;color:var(--accent-ink);font:700 15px var(--sans);padding:6px 8px 6px 0;cursor:pointer}
.theme{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px var(--sans);cursor:pointer}
.theme svg{width:16px;height:16px}
.wrap{max-width:560px;margin:0 auto;padding:4px 16px 0;zoom:var(--zoom,1)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.wrap.anim-r{animation:inR .22s ease-out}
.wrap.anim-l{animation:inL .22s ease-out}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 4px}
p{margin:0 0 10px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
body.compact .card{padding:12px;margin-bottom:10px}
body.compact .f{padding:6px 0}
.num{font-family:var(--num);font-variant-numeric:lining-nums tabular-nums}
.mute{color:var(--mute)}
.small{font-size:13px}
.good{color:var(--good)}
.bad{color:var(--brick)}

.hero{background:var(--accent);color:var(--on-accent);border-radius:18px;padding:18px 18px 16px;margin:0 0 14px}
.hero .big{font-size:40px}
.hero .bar{background:rgba(255,255,255,.25)}
:root[data-theme="dark"] .hero .bar{background:rgba(0,0,0,.25)}
.hero .bar i{background:var(--on-accent)}
.hero .small{opacity:.9}

.stub{position:relative;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:18px 16px 14px;margin:0 0 26px}
.stub::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-9px;height:9px;
  background:radial-gradient(circle at 8px 0,var(--card) 6.5px,transparent 7px) 0 0/16px 9px repeat-x}
.stub .when{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.stub .when b{font-size:18px}
.row{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:15px}
.row .dots{flex:1;border-bottom:1px dotted var(--dots);transform:translateY(-3px)}
.row.total{border-top:2px dashed var(--line);margin-top:8px;padding-top:10px;font-size:17px;font-weight:700}
.row.total b{font-size:26px;color:var(--accent-ink)}

.f{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f span{flex:1;font-size:15px}
.f small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.f input,.f select,.inp{width:108px;text-align:right;font:600 16px var(--num);border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--field);color:var(--ink)}
.f input.txt,.f select{width:160px;text-align:left;font-family:var(--sans)}
.f em{font-style:normal;color:var(--mute);width:38px;font-size:13px}
.f input[type=checkbox]{width:24px;height:24px}
.inp.wide{width:100%;text-align:left;font-family:var(--sans)}
select.inp{width:100%;text-align:left;font-family:var(--sans)}
input[type=range]{width:100%;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:1px}

.btn{font:700 16px var(--sans);border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:46px}
.btn.alt{background:var(--mist);color:var(--accent-ink)}
.btn.stop{background:var(--brick);color:#fff}
.btn.block{width:100%}
.btn.link{background:none;color:var(--accent-ink);padding:6px 0;text-decoration:underline;min-height:0;font-size:14px}
.btn[disabled]{opacity:.45}
.x{background:none;border:0;color:var(--brick);font:600 22px var(--sans);padding:2px 8px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font:600 14px var(--sans);border:1.5px solid var(--accent);color:var(--accent-ink);background:var(--card);border-radius:999px;padding:9px 13px;cursor:pointer}
.chip.sel{background:var(--accent);color:var(--on-accent)}
.badge{display:inline-block;border:1.5px solid var(--line);color:var(--mute);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;margin:0 6px 6px 0}
.badge.on{border-color:var(--gold);color:var(--gold)}

.note{background:var(--mist);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.warn{background:var(--brick-bg);color:var(--warn-ink)}
.okc{color:var(--good)} .badc{color:var(--brick)}
.bar{height:12px;background:var(--mist);border-radius:6px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.bar.over i{background:var(--brick)}
.big{font-size:32px;line-height:1.1;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.two .card{margin:0}
.stat small{display:block;color:var(--mute);font-size:13px}
.stat b{font-size:22px}
.gap{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;color:var(--ink);text-align:left;cursor:pointer;font:16px var(--sans)}
.menu:last-child{border-bottom:0}
.menu svg{width:26px;height:26px;stroke:var(--accent-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu span{flex:1}.menu b{display:block}.menu small{color:var(--mute);font-size:13px}
.menu i{font-style:normal;color:var(--mute);font-size:24px}

.list .it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it:last-child{border-bottom:0}
.list .d{width:42px;color:var(--mute);flex:none}
.list .r{flex:1;min-width:0}
.list .r small{display:block;color:var(--mute)}
.list input.m{width:62px;text-align:right;font:600 15px var(--num);border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--field);color:var(--ink)}
.list .a{width:64px;text-align:right;flex:none}
.list .off{opacity:.55}
.rowbtn{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.acct{padding:10px 0;border-bottom:1px solid var(--line)}
.acct:last-of-type{border-bottom:0}

table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}
td:last-child,th:last-child{text-align:right}
td.r,th.r{text-align:right}
table.rep td,table.rep th{padding:5px 4px;font-size:12px}
textarea{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--field);color:var(--ink)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.ck input{width:22px;height:22px}
.chk{display:flex;gap:8px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}.chk b{flex:none;width:18px}

.live{text-align:center}
.live .mi{font-size:54px;font-weight:700;line-height:1}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brick);margin-right:6px}

.lock{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.pds{display:flex;gap:14px;margin:6px 0 10px}
.pd{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.pd.on{background:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.key{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 26px var(--num);cursor:pointer}

nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:7px 0 6px;font:700 11px var(--sans);color:var(--mute);border-radius:12px;cursor:pointer}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--accent-ink);background:var(--mist)}
#pill{display:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;background:var(--brick);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:700 14px var(--sans);cursor:pointer}
#toast{display:none;position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);padding:11px 15px;border-radius:12px;font-size:14px;max-width:88%}
.cfill{fill:var(--mist)}.cline{fill:none;stroke:var(--accent);stroke-width:2.5}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.wrap{animation:none!important}}
@media print{
  body.print-report .top,body.print-report nav,body.print-report #pill,body.print-report #toast,body.print-report .wrap>*:not(#rep){display:none!important}
  body.print-report{background:#fff;color:#000;padding:0}
  body.print-report #rep{border:0;background:#fff}
  body.print-report #rep .noprint{display:none}
}
</style>
</head>
<body>
<noscript>Paycheck Plan needs JavaScript turned on.</noscript>
<div id="app"></div>
<button id="pill" type="button"></button>
<div id="toast" role="status"></div>
<script>
/* ---------- constants (2026, single filer) ---------- */
const FED=[[12400,.10],[50400,.12],[105700,.22],[201775,.24],[256225,.32],[640600,.35],[Infinity,.37]];
const NY=[[8500,.039],[11700,.044],[13900,.0515],[80650,.054],[215400,.059],[Infinity,.0685]];
const FED_STD=16100, NY_STD=8000, K401_LIMIT=24500, IRA_LIMIT=7500;
const SWIPE=['home','spend','miles','debt','goals','worth','ledger','bills','pay','taxes','plan','settings'];
const MAIN4=['home','spend','miles','debt'];
const TITLES={home:'Home',spend:'Spend',miles:'Miles',debt:'Debt',more:'More',goals:'Goals',worth:'Net worth',ledger:'Activity',bills:'Bills',pay:'Pay',taxes:'Taxes',plan:'Plan',settings:'Settings'};
const ICONS={
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  spend:'<path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H4z"/><path d="M4 7l12-3v3"/><circle cx="16.5" cy="13.5" r="1"/>',
  miles:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  debt:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  more:'<circle cx="5" cy="12" r="1.4" style="fill:currentColor"/><circle cx="12" cy="12" r="1.4" style="fill:currentColor"/><circle cx="19" cy="12" r="1.4" style="fill:currentColor"/>',
  goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  worth:'<path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/>',
  ledger:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  bills:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  pay:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  taxes:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  plan:'<path d="M5 20V11M12 20V4M19 20v-6M3 20h18"/>',
  settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
};
const THEME_ICON={
  auto:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/>',
  light:'<circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  dark:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z" fill="currentColor"/>'
};
const DEFAULT_PLACES=[];
const DEFAULT_ROUTES=[];

const DEFAULT={
  ver:3, tab:'home', mm:'', sm:'', theme:'auto', pin:'', setupDone:false, ledger:[], la:'all', lm:'all',
  prof:{name:'',org:''},
  s:{
    rate:0,hours:40,periods:24,k401:10,roth:50,matchPct:50,matchCap:6,premium:0,mainFed:'',mainState:'',
    pplGross:0,pplFed:0,pplState:0,pplNet:0,pplHours:0,
    mileRate:0.725,defPurpose:'Work travel',homePlace:'',workPlace:'',payDay1:1,payDay2:15,
    checking:0,saved:0,goal:1000,savePpl:0,saveMain:0,
    debtPay:0,debtMethod:'avalanche',
    iraMonthly:0,efMonthly:0,
    k401Bal:0,iraBal:0,otherBal:0,
    buffer:25,showRemind:1,remindDays:3,textSize:'normal',compact:0,
    age:25,retireAge:65,ret:5
  },
  checks:[], debts:[], debtPays:[], places:[], routes:[], odo:[],
  cats:[{name:'Food',budget:300},{name:'Gas',budget:150},{name:'Fun',budget:200},{name:'Shopping',budget:150},{name:'Subscriptions',budget:50},{name:'Other',budget:150}],
  exp:[],
  accounts:[{id:1,name:'Checking',type:'checking',open:0,balance:0},{id:2,name:'Savings',type:'savings',open:0,balance:0},{id:3,name:'Cash',type:'cash',open:0,balance:0}],
  goals:[{id:1,name:'Starter emergency fund',link:'starter'}],
  snaps:[], bills:[], trips:[]
};

/* ---------- state + storage ---------- */
const KEY='paycheck-plan-v1';
const clone=o=>JSON.parse(JSON.stringify(o));
let S=clone(DEFAULT), resetArm=false, tt, anim='', rec=null, pend=null, locked=false, lockBuf='', pinArm=false, hidAt=0;
let wiz={step:0,name:'',chk:'',sav:'',cash:'',rate:'',hours:'40',k401:'10',pg:'',pf:'',ps:'',pn:'',dname:'',dbal:'',dapr:'',dmin:''}, nidc=0, depAcct='none';
let edit=null, delArm=false, acctArm=null, qaAcct='none', whatIf=0, expSel='Expenses', stub={job:'Main job',gross:'',pre:'',roth:'',fed:'',st:'',fica:'',other:'',net:''}, qaCat='';

const store={
  async get(){
    try{if(window.storage){const r=await window.storage.get(KEY);return r&&r.value?r.value:null;}}catch(e){return null;}
    try{return localStorage.getItem(KEY);}catch(e){return null;}
  },
  async set(v){
    try{if(window.storage){await window.storage.set(KEY,v);return;}}catch(e){return;}
    try{localStorage.setItem(KEY,v);}catch(e){}
  }
};
function ensureAccounts(d){
  if(d&&Array.isArray(d.accounts)&&d.accounts.length)return;
  const s=(d&&d.s)||{};
  const c=+s.checking||0,v=+s.saved||0;
  S.accounts=[{id:1,name:'Checking',type:'checking',open:c,balance:c},{id:2,name:'Savings',type:'savings',open:v,balance:v},{id:3,name:'Cash',type:'cash',open:0,balance:0}];
}
function migrateAccounts(){
  if(!Array.isArray(S.ledger))S.ledger=[];
  S.accounts.forEach(a=>{if(a.open==null)a.open=+a.balance||0;});
  recalc();
}
async function load(){
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  try{
    const raw=await store.get();
    if(raw){
      const d=JSON.parse(raw), base=clone(DEFAULT);
      S=Object.assign(base,d);
      S.s=Object.assign(clone(DEFAULT).s,d.s||{});
      S.prof=Object.assign(clone(DEFAULT).prof,d.prof||{});
      if((d.ver||1)<2&&S.s.iraMonthly===625)S.s.iraMonthly=0;
      S.ver=3;
      S.debts.forEach(x=>{if(x.orig==null)x.orig=x.balance;});
      S.trips.forEach(x=>{if(x.purpose==null)x.purpose='';});
      ensureAccounts(d);
      migrateAccounts();
      if(d.setupDone===undefined)S.setupDone=true;
      if(!SWIPE.includes(S.tab)&&S.tab!=='more')S.tab='home';
    }
  }catch(e){}
  locked=!!S.pin;
  autoSnap();
  render();
}
async function save(){ await store.set(JSON.stringify(S)); }

/* ---------- helpers ---------- */
const usd=(n,d=2)=>{const a=Math.abs(n);const v=a.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  return (n<0&&Math.round(a*Math.pow(10,d))>0?'-':'')+'$'+v;};
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=id=>document.getElementById(id);
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const setp=(p,v)=>{const k=p.split('.');const l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v;};
const num=v=>parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''))||0;
const sod=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const isoDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtDate=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fmtISO=s=>{const p=s.split('-');return (+p[1])+'/'+(+p[2]);};
const monthYear=d=>d.toLocaleDateString('en-US',{month:'short',year:'numeric'});

function nextMainPay(){
  const d=sod(),s=S.s;
  const d1=Math.min(28,Math.max(1,Math.round(s.payDay1)||1)),d2=Math.min(28,Math.max(1,Math.round(s.payDay2)||15));
  const adj=x=>{const w=x.getDay();return w===6?new Date(x.getFullYear(),x.getMonth(),x.getDate()-1):w===0?new Date(x.getFullYear(),x.getMonth(),x.getDate()-2):x;};
  const y=d.getFullYear(),m=d.getMonth();
  const c=[new Date(y,m,d1),new Date(y,m,d2),new Date(y,m+1,d1),new Date(y,m+1,d2)].map(adj).sort((a,b)=>a-b);
  return c.find(x=>x>=d);
}

/* ---------- money math ---------- */
function bracketTax(x,br){let t=0,prev=0;for(const [cap,r] of br){if(x>prev)t+=(Math.min(x,cap)-prev)*r;if(x<=cap)break;prev=cap;}return t;}
function margRate(x,br){for(const [cap,r] of br){if(x<=cap)return r;}return br[br.length-1][1];}

function main(){
  const s=S.s;
  const gross=s.rate*s.hours*52/s.periods;
  const kp=s.k401/100, rothAmt=gross*kp*s.roth/100, preAmt=gross*kp*(1-s.roth/100);
  const fica=gross*0.0765;
  const taxableYr=(gross-preAmt-s.premium)*s.periods;
  const estFed=bracketTax(Math.max(0,taxableYr-FED_STD),FED)/s.periods;
  const estSt=bracketTax(Math.max(0,taxableYr-NY_STD),NY)/s.periods;
  const fed=s.mainFed===''?estFed:+s.mainFed, st=s.mainState===''?estSt:+s.mainState;
  const match=gross*Math.min(s.k401,s.matchCap)/100*s.matchPct/100;
  const net=gross-preAmt-rothAmt-s.premium-fica-fed-st;
  return {gross,preAmt,rothAmt,fica,fed,st,estFed,estSt,match,net,premium:s.premium};
}
function pplOther(){const s=S.s;return s.pplGross-s.pplFed-s.pplState-s.pplNet;}

function taxCalc(){
  const s=S.s,m=main();
  const mainG=m.gross*s.periods, pplG=s.pplGross*52;
  const pre=(m.preAmt+s.premium)*s.periods;
  const agi=mainG+pplG-pre;
  const fedTaxable=Math.max(0,agi-FED_STD), nyTaxable=Math.max(0,agi-NY_STD);
  const fedTax=bracketTax(fedTaxable,FED), nyTax=bracketTax(nyTaxable,NY);
  const fedW=m.fed*s.periods+s.pplFed*52, nyW=m.st*s.periods+s.pplState*52;
  const fedDiff=fedW-fedTax, nyDiff=nyW-nyTax, total=fedDiff+nyDiff;
  return {mainG,pplG,pre,agi,fedTaxable,nyTaxable,fedTax,nyTax,fedW,nyW,fedDiff,nyDiff,total,
    fedM:margRate(fedTaxable,FED),nyM:margRate(nyTaxable,NY),extraPerPpl:total<0?(-total)/52:0};
}

function proj(){
  const s=S.s,m=main();
  const years=Math.max(1,s.retireAge-s.age), r=s.ret/100;
  const k=(m.gross*s.k401/100+m.match)*s.periods;
  const ira=Math.min(s.iraMonthly*12,IRA_LIMIT);
  let bal=s.k401Bal+s.iraBal;const pts=[bal];
  for(let y=1;y<=years;y++){bal=bal*(1+r)+(k+ira)*(1+r/2);pts.push(bal);}
  return {years,pts,final:bal};
}

function safeToSpend(){
  const now=sod(),ym=isoDate(now).slice(0,7),td=isoDate(now),s=S.s;
  const budget=catBudget(), spent=sum(monthExp(ym),e=>e.amt);

  const allowance=Math.max(0,(budget-(spent-spentToday))/left);
  const raw=allowance-spentToday, cap=Math.max(0,spendable()-s.buffer);
  return {budget,spent,spentToday,left,allowance,raw,cap,capped:raw>cap,today:Math.max(0,Math.min(raw,cap)),pct:budget>0?Math.min(100,spent/budget*100):0};
}

/* ---------- debt math ---------- */
function sim(debts,monthly,method){
  const d=debts.map(x=>({b:Math.max(0,x.balance),r:x.apr/1200,m:x.min,done:0}));
  let month=0,interest=0;
  const curve=[d.reduce((a,x)=>a+x.b,0)], ints=[0];
  while(d.some(x=>x.b>0.005)&&month<600){
    month++;let pool=monthly,mi=0;
    d.forEach(x=>{if(x.b>0){const i=x.b*x.r;x.b+=i;interest+=i;mi+=i;}});
    d.forEach(x=>{if(x.b>0){const p=Math.min(x.m,x.b,pool);x.b-=p;pool-=p;}});
    d.filter(x=>x.b>0).sort(method==='snowball'?(a,b)=>a.b-b.b:(a,b)=>b.r-a.r).forEach(x=>{const p=Math.min(x.b,pool);x.b-=p;pool-=p;});
    d.forEach(x=>{if(x.b<=0.005&&!x.done)x.done=month;});
    curve.push(d.reduce((a,x)=>a+Math.max(0,x.b),0));ints.push(mi);
  }
  return {months:month,interest,done:d.map(x=>x.done),curve,ints,ok:!d.some(x=>x.b>0.005)};
}
function debtInfo(){
  const bal=sum(S.debts,d=>d.balance), mins=sum(S.debts,d=>d.min), meth=S.s.debtMethod;
  const monthly=Math.max(S.s.debtPay,mins);
  return {bal,mins,monthly,meth,plan:sim(S.debts,monthly,meth),base:sim(S.debts,mins,meth)};
}
function need(N){
  const bal=sum(S.debts,d=>d.balance),meth=S.s.debtMethod;
  let lo=0.01,hi=Math.max(bal*2,100);
  for(let i=0;i<40;i++){const mid=(lo+hi)/2;const r=sim(S.debts,mid,meth);if(r.ok&&r.months<=N)hi=mid;else lo=mid;}
  return hi;
}

/* ---------- pay stub checker ---------- */
function stubCheck(){
  const x=stub,g=num(x.gross);if(!g)return null;
  const pre=num(x.pre),roth=num(x.roth),fed=num(x.fed),st=num(x.st),fica=num(x.fica),other=num(x.other),net=num(x.net);
  const m=main(),res=[];
  const calc=g-pre-roth-fed-st-fica-other;
  if(net){const diff=net-calc;
    res.push(Math.abs(diff)<=0.75?{k:1,t:'Adds up: gross minus deductions equals your deposit.'}
      :{k:0,t:`Deductions do not add up. Your deposit is ${usd(Math.abs(diff))} ${diff>0?'higher':'lower'} than gross minus the lines you entered, so something is missing or mistyped.`});}
  const exp=g*0.0765;
  if(fica<exp*0.5)res.push({k:0,t:`Social Security and Medicare look missing or low. About ${usd(exp)} is normal for this gross and you entered ${usd(fica)}.`});
  else if(Math.abs(fica-exp)>Math.max(1,exp*0.1))res.push({k:2,t:`Social Security and Medicare are ${usd(fica)}, but ${usd(exp)} is typical.`});
  else res.push({k:1,t:'Social Security and Medicare look right.'});
  let partial=false;
  if(x.job==='Main job'){
    const tot=pre+roth,pct=tot/g*100;
    if(Math.abs(pct-S.s.k401)<=0.6)res.push({k:1,t:`401(k) is ${pct.toFixed(1)}% of pay, matching your ${S.s.k401}% setting.`});
    else res.push({k:0,t:`401(k) is ${pct.toFixed(1)}% of pay, not your ${S.s.k401}% setting. Check your Empower contribution rate.`});
    if(tot>0){const rs=roth/tot*100;if(Math.abs(rs-S.s.roth)>3)res.push({k:2,t:`Roth is ${rs.toFixed(0)}% of your 401(k), but the app assumes ${S.s.roth}%.`});}
    partial=Math.abs(g-m.gross)/m.gross>0.15;
    if(partial)res.push({k:2,t:`Gross is ${usd(g)}, far from a usual ${usd(m.gross)}. This looks like a partial period, so it will not be used for tax estimates.`});
    else{
      const ep=m.estFed/m.gross*100,fp=fed/g*100;
      if(fed<=0)res.push({k:2,t:'No federal tax entered.'});
      else if(fp<ep*0.6)res.push({k:0,t:`Federal withholding is ${fp.toFixed(1)}% of pay versus about ${ep.toFixed(1)}% expected. You could owe at tax time.`});
      else res.push({k:1,t:`Federal withholding is ${fp.toFixed(1)}% of pay, in line with the estimate.`});
    }
  }else{
    if(Math.abs(g-S.s.pplGross)>S.s.pplGross*0.08)res.push({k:2,t:`Gross is ${usd(g)} versus a usual ${usd(S.s.pplGross)}.`});
  }
  return {res,partial,calc};
}

/* ---------- location ---------- */
const locMsg=e=>e&&e.code===1?'Location is blocked. Allow it in your device settings, or add trips by hand.':'Could not get your location. Try again with a clear view of the sky.';
function hav(a,b){const R=3958.8,r=x=>x*Math.PI/180;const dLat=r(b[0]-a[0]),dLon=r(b[1]-a[1]);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function nearest(pt){
  let best=null,bd=0.16;
  S.places.forEach(p=>{if(p.lat!=null){const d=hav(pt,[p.lat,p.lng]);if(d<=bd){bd=d;best=p.name;}}});
  return best;
}
function here(cb){
  try{
    if(!navigator.geolocation){toast('Location is not available here. Add trips by hand.');return;}
    toast('Finding your location...');
    navigator.geolocation.getCurrentPosition(p=>cb([p.coords.latitude,p.coords.longitude]),err=>toast(locMsg(err)),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  }catch(e){toast('Location is not available here. Add trips by hand.');}
}
function startTrip(){
  if(rec){setTab('miles');return;}
  try{
    if(!navigator.geolocation){toast('Location is not available here. Add trips by hand.');return;}
    rec={miles:0,last:null,cur:null,from:null,fix:false,start:Date.now(),wake:null,id:null};
    rec.id=navigator.geolocation.watchPosition(onPos,err=>{toast(locMsg(err));if(err&&err.code===1)cancelRec();},{enableHighAccuracy:true,maximumAge:2000,timeout:30000});
    try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{if(rec)rec.wake=w;}).catch(()=>{});}catch(e){}
  }catch(e){rec=null;toast('Location is not available here. Add trips by hand.');}
  S.tab='miles';render();
}
function onPos(p){
  if(!rec)return;
  const c=p.coords;if(c.accuracy>60)return;
  const pt=[c.latitude,c.longitude];rec.fix=true;
  if(!rec.last){rec.last=pt;rec.from=nearest(pt);}
  else{const d=hav(rec.last,pt);if(d>=0.01){rec.miles+=d;rec.last=pt;}}
  rec.cur=pt;updateLive();
}
function cancelRec(){
  if(!rec)return;
  try{navigator.geolocation.clearWatch(rec.id);}catch(e){}
  try{if(rec.wake)rec.wake.release();}catch(e){}
  rec=null;q('pill').style.display='none';
}
function stopTrip(){
  if(!rec)return;
  const r=rec,to=r.cur?nearest(r.cur):null;
  cancelRec();
  pend={date:isoDate(sod()),from:r.from||'',to:to||'',miles:Math.round(r.miles*10)/10};
  render();
}
function updateLive(){
  const pill=q('pill');
  if(!rec){pill.style.display='none';return;}
  const m=rec.miles.toFixed(1);
  pill.style.display=(S.tab==='miles'||locked)?'none':'block';
  pill.textContent='Recording '+m+' mi';
  const a=q('live-mi'),b=q('live-amt'),c=q('live-from');
  if(a)a.textContent=m;
  if(b)b.textContent=usd(rec.miles*S.s.mileRate);
  if(c)c.textContent=rec.fix?('Started at '+(rec.from||'an unsaved spot')):'Waiting for a GPS fix...';
}

};

  if(kind==='exp'){label='expense';f=`<input class="inp wide" id="ed-amt" inputmode="decimal" value="${x.amt}" aria-label="Amount"><select class="inp" id="ed-cat" aria-label="Category">${catOptions(x.cat)}</select><input class="inp wide" id="ed-note" value="${esc(x.note||'')}" placeholder="Note" aria-label="Note"><input class="inp wide" id="ed-date" type="date" value="${x.date}" aria-label="Date"><select class="inp" id="ed-acct" aria-label="Paid from">${acctOptions(x.acct||'none')}</select>`;}
  else if(kind==='bill'){label='bill';f=`<input class="inp wide" id="ed-name" value="${esc(x.name)}" aria-label="Name"><input class="inp wide" id="ed-amt" inputmode="decimal" value="${x.amount||''}" placeholder="Amount" aria-label="Amount"><input class="inp wide" id="ed-day" inputmode="numeric" value="${x.day}" aria-label="Due day of the month">`;}
  else if(kind==='check'){label='paycheck';f=`<input class="inp wide" id="ed-date" type="date" value="${x.date}" aria-label="Date"><select class="inp" id="ed-job" aria-label="Job"><option ${x.job==='Main job'?'selected':''}>Main job</option><option ${x.job==='Second job'?'selected':''}>Second job</option></select><input class="inp wide" id="ed-gross" inputmode="decimal" value="${x.gross}" aria-label="Gross pay"><input class="inp wide" id="ed-net" inputmode="decimal" value="${x.net}" aria-label="Deposit"><select class="inp" id="ed-acct" aria-label="Deposit to">${depOptions(x.acct||'none')}</select>`;}
  else if(kind==='led'){
    if(x.kind==='transfer')return `<div class="card"><h2>Transfer</h2><p class="small">${esc(x.desc)} on ${fmtISO(x.date)} for ${usd(Math.abs(x.amt))}. Deleting it removes both sides.</p><div style="display:grid;gap:8px"><button class="btn alt" data-act="deleteEdit">Delete transfer</button><button class="btn link" data-act="cancelEdit">Cancel</button></div></div>`;
    label='entry';f=`<select class="inp" id="ed-dir" aria-label="Direction"><option value="in" ${x.amt>=0?'selected':''}>Money in</option><option value="out" ${x.amt<0?'selected':''}>Money out</option></select><input class="inp wide" id="ed-amt" inputmode="decimal" value="${Math.abs(x.amt)}" aria-label="Amount"><select class="inp" id="ed-acct" aria-label="Account">${S.accounts.map(a=>`<option value="${a.id}" ${a.id==x.acct?'selected':''}>${esc(a.name)}</option>`).join('')}</select><input class="inp wide" id="ed-desc" value="${esc(x.desc)}" aria-label="Description"><input class="inp wide" id="ed-date" type="date" value="${x.date}" aria-label="Date">`;}
  else{label='trip';f=`<input class="inp wide" id="ed-date" type="date" value="${x.date}" aria-label="Date"><input class="inp wide" id="ed-from" value="${esc(x.from)}" aria-label="From"><input class="inp wide" id="ed-to" value="${esc(x.to)}" aria-label="To"><input class="inp wide" id="ed-mi" inputmode="decimal" value="${x.miles}" aria-label="Miles"><input class="inp wide" id="ed-purpose" value="${esc(x.purpose||'')}" placeholder="Purpose" aria-label="Purpose"><label class="ck"><input type="checkbox" id="ed-reimb" ${reimb(x)?'checked':''}>Counts toward reimbursement</label>`;}
  return `<div class="card"><h2>Edit ${label}</h2><div style="display:grid;gap:8px">${f}<button class="btn" data-act="saveEdit">Save changes</button><button class="btn alt" data-act="deleteEdit">Delete</button><button class="btn link" data-act="cancelEdit">Cancel</button></div></div>`;
}

function reportText(list,mk){
  const paid=list.filter(reimb),mi=sum(paid,t=>t.miles),am=sum(paid,t=>t.miles*t.rate);
  const L=[`${S.prof.org} travel and expense reimbursement`,`Name\t${S.prof.name}`,`Period\t${monthName(mk)}`,`Rate per mile\t${S.s.mileRate}`,'','Date\tFrom\tTo\tPurpose\tMiles\tAmount'];
  paid.forEach(t=>L.push([t.date,t.from,t.to,t.purpose||'',t.miles,(t.miles*t.rate).toFixed(2)].join('\t')));
  L.push(['Total','','','',mi.toFixed(1),am.toFixed(2)].join('\t'));
  return L.join('\n');
}

function whatIfHTML(){
  const di=debtInfo();
  if(!whatIf)return '<span class="mute">Slide to see what paying more each month does.</span>';
  const r=sim(S.debts,di.monthly+whatIf,di.meth),sm=di.plan.months-r.months,si=di.plan.interest-r.interest;
  return `Add <b>${usd(whatIf,0)}</b> a month and you are debt free in <b>${r.months} ${r.months===1?'month':'months'}</b>${sm>0?`, ${sm} sooner`:''}, saving about <b class="good num">${usd(si,0)}</b> in interest. <button class="btn link" data-act="applyWhatIf">Use this payment</button>`;
}

function vDebt(){
  const s=S.s,di=debtInfo(),hasDebt=di.bal>0.005;

  const sched=di.plan.curve.map((b,i)=>i===0?null:{i,paid:di.plan.curve[i-1]+di.plan.ints[i]-b,int:di.plan.ints[i],bal:b}).filter(Boolean);
  const aprNote=S.debts.some(d=>d.aprAssumed);
  const orig=sum(S.debts,d=>d.orig||d.balance), pp=orig>0?Math.min(1,Math.max(0,1-di.bal/orig)):0;
  const other=sim(S.debts,di.monthly,di.meth==='snowball'?'avalanche':'snowball');
  const noBill=!S.bills.some(b=>/card|loan|debt/i.test(b.name));
  return `

  <div class="card">
    <div class="small mute">Total debt</div>

      :`<div class="note warn" style="margin-top:8px">${usd(di.monthly,0)} a month does not cover the interest. Raise your payment.</div>`}
    <div class="bar" aria-hidden="true"><i style="width:${pp*100}%"></i></div>

    ${hasDebt?`<p class="small mute" style="margin-top:8px">On payday, send about <b class="num">${usd(di.monthly/2,0)}</b> from each main check.</p>`:''}

  ${hasDebt?`<div class="card"><h2>What if I pay more?</h2>

    <details style="margin-top:8px"><summary>Month by month</summary>

function setTab(t){

function go(dir){

function restoreFrom(text){
  try{
    const d=JSON.parse(text);
    if(!d||!d.s)throw new Error('bad');
    const pin=S.pin,tab=S.tab;
    S=Object.assign(clone(DEFAULT),d);S.s=Object.assign(clone(DEFAULT).s,d.s);S.prof=Object.assign(clone(DEFAULT).prof,d.prof||{});
    S.pin=pin;S.tab=tab;S.ver=3;
    S.debts.forEach(x=>{if(x.orig==null)x.orig=x.balance;});
    S.trips.forEach(x=>{if(x.purpose==null)x.purpose='';});
    ensureAccounts(d);
    migrateAccounts();S.setupDone=true;
    save();render();toast('Restored.');return true;
  }catch(err){toast('That is not a valid backup.');return false;}
}

  }
  else if(el.dataset.trip){const t=S.trips.find(x=>x.id==el.dataset.trip);if(t){t.miles=num(el.value);save();render();}}
  else if(el.dataset.route){const r=S.routes[+el.dataset.route];if(r){r.m=num(el.value);save();render();}}
  else if(el.dataset.cat!=null&&el.dataset.cat!==''){
    const c=S.cats[+el.dataset.cat],f=el.dataset.f;
    if(c){if(f==='name'){const nv=el.value.trim()||c.name;S.exp.forEach(x=>{if(x.cat===c.name)x.cat=nv;});c.name=nv;}else c.budget=num(el.value);save();render();}
  }
  else if(el.dataset.goal){
    const g=S.goals.find(x=>x.id==el.dataset.goal),f=el.dataset.f;
    if(g){const v=f==='name'?(el.value.trim()||'Goal'):num(el.value);
      if(g.link==='starter'){if(f==='target')S.s.goal=v;}else g[f]=v;
      save();render();}
  }
  else if(el.dataset.debt){
    const d=S.debts.find(x=>x.id==el.dataset.debt),f=el.dataset.f;
    if(d){d[f]=f==='name'?(el.value.trim()||'Debt'):num(el.value);if(f==='apr')d.aprAssumed=false;if(f==='balance'&&d.balance>(d.orig||0))d.orig=d.balance;save();render();}
  }else if(el.dataset.act==='pickMonth'){S.mm=el.value;save();render();}
  else if(el.dataset.act==='pickSpendMonth'){S.sm=el.value;save();render();}
  else if(el.dataset.act==='pickLedAcct'){S.la=el.value;save();render();}
  else if(el.dataset.act==='pickLedMonth'){S.lm=el.value;save();render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='whatif'){whatIf=+e.target.value;const o=q('whatif-out');if(o)o.innerHTML=whatIfHTML();}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hidAt=Date.now();}
  else if(S.pin&&hidAt&&Date.now()-hidAt>30000){locked=true;lockBuf='';render();}
});

/* install + offline */
let deferredInstall=null;
const isStandalone=()=>{try{return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}catch(e){return false;}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S.tab==='settings'&&!locked)render();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('Installed.');if(!locked)render();});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

/* swipe between pages */
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{
  const t=e.touches[0];sx=t.clientX;sy=t.clientY;
  skip=locked||e.touches.length>1||sx<24||sx>window.innerWidth-24||!!e.target.closest('input,textarea,select,svg,[data-noswipe]');
},{passive:true});
document.addEventListener('touchend',e=>{
  if(skip)return;
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(dx<0?1:-1);
},{passive:true});

load();
</script>
</body>
</html>
